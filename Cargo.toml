[package]
name = "rview-fs"
version = "0.1.0"
edition = "2024"
publish = false
repository = "https://github.com/mahmoudhas/rview-fs"
description = "A read-only FUSE union of the directories a group of machines export, files of other machines read over RDMA when first touched"


[features]
default = ["ucx"]
# Files of other machines over RDMA (UCX), on by default. Building needs libibverbs-dev
# and librdmacm-dev; --no-default-features builds without.
ucx = ["velo/ucx"]

[dependencies]
anyhow = "1"
async-nats = "0.49"
bytes = "1.10"
clap = { version = "4", features = ["derive", "env"] }
fractal-fuse = "0.6.1"
futures = "0.3"
libc = "0.2"
memmap2 = "0.9"
parking_lot = "0.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tokio-util = "0.7"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
velo = { version = "0.21", default-features = false }
prometheus = { version = "0.14", default-features = false }

[dev-dependencies]
tempfile = "3"
